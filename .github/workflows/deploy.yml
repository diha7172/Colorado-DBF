name: Deploy site to GitHub Pages

# Deploys the site to GitHub Pages. One-time setup: in the repo go to Settings,
# then Pages, and set "Build and deployment > Source" to "GitHub Actions". After
# that, every push to these branches deploys, and it can be run by hand from the
# Actions tab.
on:
  push:
    branches: [main, claude/eager-archimedes-ebgv5j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
